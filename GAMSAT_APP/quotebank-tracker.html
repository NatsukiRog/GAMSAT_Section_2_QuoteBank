<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e6e66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Practice Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Quote Bank Practice Log</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f5f6;--card:#fff;--ink:#14232e;--mute:#5b6b76;--line:#d6dee3;--acc:#0e6e66;--accfg:#fff;--hi:#f2b705;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a20;--card:#17262e;--ink:#e6eef2;--mute:#92a4ae;--line:#2b3f4a;--acc:#3dc2b5;--accfg:#06201d;--hi:#f2b705;--bad:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a20;--card:#17262e;--ink:#e6eef2;--mute:#92a4ae;--line:#2b3f4a;--acc:#3dc2b5;--accfg:#06201d;--hi:#f2b705;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font:700 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:600 1.05rem/1.3 system-ui,sans-serif;margin:0 0 10px}
p.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
nav{display:flex;gap:6px;margin:12px 0;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;color:var(--mute);font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.q{border-left:4px solid var(--acc);padding:6px 0 6px 12px;margin:10px 0}
.q blockquote{margin:0;font:1.02rem/1.45 Georgia,serif}
.q small{color:var(--mute)}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;color:var(--mute)}
.code{font:600 .95rem ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);padding:6px 8px;border-radius:6px;display:block;margin:6px 0}
.err{color:var(--bad);font-size:.9rem;margin:6px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.75rem;color:var(--mute)}
.cal button{aspect-ratio:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;cursor:pointer;position:relative;padding:0}
.cal button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.cal button.today{font-weight:700}
.cal button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--hi)}
.cal .pad{visibility:hidden}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.log{border-top:1px solid var(--line);padding:10px 0}
.log:first-of-type{border-top:0}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.note{font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Quote Bank Practice Log</h1>
<p class="sub">Paste a set code from the website, then log how the session went. Everything stays on this device.</p>
<nav role="tablist" aria-label="Sections">
<button role="tab" aria-selected="true" data-t="today">Today</button>
<button role="tab" aria-selected="false" data-t="cal">Calendar</button>
<button role="tab" aria-selected="false" data-t="themes">Themes</button>
</nav>

<section id="today">
<div class="card">
<h2>Enter a set code</h2>
<label for="code">Code from the website</label>
<div class="row"><input id="code" placeholder="GQ-0001-0002-0003-0004-00" autocomplete="off" autocapitalize="characters"><button class="btn" id="load" style="flex:0 0 auto">Load set</button></div>
<p class="err" id="err" role="alert"></p>
<p class="note"><span id="bankstat"></span> <button class="btn alt" id="refresh">Check for new quotes</button></p>
<p class="note">No website handy? <button class="btn alt" id="demo">Make a random set</button></p>
</div>
<div id="set"></div>
</section>

<section id="cal" hidden>
<div class="card">
<div class="mhead"><button class="btn alt" id="prev" aria-label="Previous month">&lsaquo;</button><strong id="mname"></strong><button class="btn alt" id="next" aria-label="Next month">&rsaquo;</button></div>
<div class="cal" id="grid"></div>
</div>
<div class="card"><h2 id="dtitle">Pick a day</h2><div id="dlist"></div></div>
</section>

<section id="themes" hidden>
<div class="card"><h2>Theme coverage</h2><p class="note">Based on the quote you chose in each session.</p><div id="cov"></div></div>
<div class="card"><h2>Your data</h2>
<div class="row"><button class="btn alt" id="exp">Export backup</button><button class="btn alt" id="imp">Import backup</button></div>
<input type="file" id="file" accept="application/json" hidden>
<p class="note" id="dmsg"></p></div>
</section>
</main>

<script>
// Quotes load from the project's quotes.csv (columns used: id, quote, author, source, primary_theme, task).
var BANK_URLS=["https://raw.githubusercontent.com/NatsukiRog/GAMSAT_Section_2_QuoteBank/main/quotebank/quotes.csv","https://natsukirog.github.io/GAMSAT_Section_2_QuoteBank/quotebank/quotes.csv"];
var BANK=[],byId={};
function parseCSV(t){var rows=[],r=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";if(r.length>1||r[0]!=="")rows.push(r);r=[]}
    else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
function setBank(csv){
  var rows=parseCSV(csv),h=rows.shift().map(function(x){return x.trim().toLowerCase()});
  var list=rows.map(function(r){var g=function(n){var i=h.indexOf(n);return i<0?"":(r[i]||"").trim()};
    return{id:g("id"),text:g("quote"),by:g("author")+(g("source")?", "+g("source"):""),theme:g("primary_theme")||"Unsorted",task:g("task")||"Both"}})
    .filter(function(q){return /^Q\d+$/.test(q.id)&&q.text});
  if(!list.length)throw 0;
  BANK=list;byId={};list.forEach(function(q){byId[q.id]=q})}
var FALLBACK=[
["Q1794668407643","There is no such thing as 'too late' in life.","Morris S. Schwartz"],
["Q1794669564150","True peace is not merely the absence of tension: it is the presence of justice.","Martin Luther King Jr."],
["Q1794670110869","It isn't enough to talk about peace. One must believe in it. And it isn't enough to believe in it. One must work at it.","Eleanor Roosevelt"],
["Q1794670384773","Only those who will risk going too far can possibly find out how far one can go.","T.S. Elliot"],
["Q1794670753280","Rage supplies arms.","Virgil"],
["Q1794671194361","England expects that every man will do his duty","Horatio Nelson"],
["Q1794671356429","There is no virtue in curiosity.","Yukio Mishima"],
["Q1794675443719","Tyranny cannot defeat the power of ideas.","Helen Keller"],
["Q1794675809734","Life is complicated. It's filled with nuance. It's unsatisfying. If I believe in anything, it is doubt.","Anthony Bourdain"],
["Q1794676148004","The price of greatness is responsibility.","Winston Churchill"],
["Q1794676377134","You get freedom by letting your enemy know that you'll do anything to get your freedom; then you'll get it.","Malcolm X"],
["Q1794676629176","From each according to his abilities, to each according to his needs!","Karl Marx"],
["Q1794676873297","The Democratical State is not Patriarchal","Georg Wilhelm Friedrich Hegel"],
["Q1794739792737","Political power grows out of the barrel of a gun","Mao Zedong"],
["Q1794744549479","Liberty consists in the division of power.","Lord Acton"]
];
function fallbackCSV(){return "id,quote,author\n"+FALLBACK.map(function(r){return r.map(function(c){return '"'+c.replace(/"/g,'""')+'"'}).join(",")}).join("\n")}
function showStat(extra){$("bankstat").textContent=BANK.length+" quotes ready. "+(extra||"")}
function fetchCSV(i){
  if(i>=BANK_URLS.length)return Promise.reject();
  return fetch(BANK_URLS[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).catch(function(){return fetchCSV(i+1)})}
function initBank(){
  try{var c=localStorage.getItem("qb-bank");if(c&&!BANK.length)setBank(c)}catch(e){}
  showStat("Checking GitHub…");
  return fetchCSV(0).then(function(t){setBank(t);try{localStorage.setItem("qb-bank",t)}catch(e){}showStat("Loaded from GitHub just now.")})
    .catch(function(){if(!BANK.length){setBank(fallbackCSV());showStat("Couldn’t reach GitHub, so this is using 15 built-in sample quotes.")}else showStat("Couldn’t reach GitHub, using your last saved quotes.")})}

// Set code: GQ-<4 quote IDs, sorted, as base-36>-<2 digit checksum>. Quote IDs look like Q1794668407643.
function pad(n,l){return String(n).padStart(l,"0")}
function num(id){return parseInt(id.slice(1),10)}
function cs(ns){var s=0;ns.forEach(function(v,i){s+=v*(i+3)});return pad(s%97,2)}
function makeCode(ids){var ns=ids.map(num).sort(function(a,b){return a-b});
  return "GQ-"+ns.map(function(n){return pad(n.toString(36).toUpperCase(),8)}).join("-")+"-"+cs(ns)}
function parseCode(s){
  var m=/^GQ-([0-9A-Z]{8})-([0-9A-Z]{8})-([0-9A-Z]{8})-([0-9A-Z]{8})-(\d{2})$/.exec(String(s).trim().toUpperCase());
  if(!m)return{error:"That doesn’t look like a set code. It should start with GQ- and have four groups of eight characters."};
  var ns=[1,2,3,4].map(function(i){return parseInt(m[i],36)});
  if(cs(ns)!==m[5])return{error:"The checksum doesn’t match. Check the code for a typo."};
  var ids=ns.map(function(n){return "Q"+n});return{ids:ids,code:makeCode(ids)}}

// Storage: localStorage when available, in-memory otherwise.
var mem=[];
function load(){try{var v=localStorage.getItem("qb-log");return v?JSON.parse(v):mem}catch(e){return mem}}
function save(a){mem=a;try{localStorage.setItem("qb-log",JSON.stringify(a))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)}

// Tabs
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  ["today","cal","themes"].forEach(function(t){$(t).hidden=t!==b.dataset.t});
  if(b.dataset.t==="cal")drawCal();if(b.dataset.t==="themes")drawCov();
}});

// Today
var current=null;
function showSet(p){
  current=p;$("err").textContent="";
  var h='<div class="card"><h2>Your set</h2><span class="code">'+p.code+'</span>';
  p.ids.forEach(function(id){var q=byId[id];
    h+=q?'<div class="q"><blockquote>“'+esc(q.text)+'”</blockquote><small>'+esc(q.by)+'</small><span class="tag">'+q.theme+'</span><span class="tag">'+(q.task==="Both"?"Both tasks":"Task "+q.task)+'</span></div>'
        :'<div class="q"><small>Quote '+esc(id)+' wasn’t found in the GitHub quote list. Check the code, or the quote may have been removed.</small></div>'});
  h+='</div><div class="card"><h2>Log this session</h2><div class="row"><div><label for="task">Task</label><select id="task"><option>A</option><option>B</option></select></div>'
   +'<div><label for="pick">Quote you wrote on</label><select id="pick">'+p.ids.filter(function(i){return byId[i]}).map(function(i){return'<option value="'+i+'">'+esc(byId[i].by+": "+byId[i].text.slice(0,32))+'…</option>'}).join("")+'</select></div></div>'
   +'<div class="row"><div><label for="mins">Minutes</label><input id="mins" type="number" min="1" value="30"></div><div><label for="rate">Self-rating (1–5)</label><select id="rate"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div></div>'
   +'<label for="notes">Notes: what worked, what to fix</label><textarea id="notes" rows="3"></textarea><p><button class="btn" id="log">Save session</button> <span class="note" id="saved"></span></p></div>';
  $("set").innerHTML=h;
  $("log").onclick=function(){
    var a=load();a.push({id:Date.now(),date:ymd(new Date()),code:p.code,task:$("task").value,pick:$("pick").value,mins:+$("mins").value||0,rate:+$("rate").value,notes:$("notes").value.trim()});
    save(a);$("saved").textContent="Saved. See it on the Calendar tab."};
}
$("load").onclick=function(){
  var p=parseCode($("code").value);
  if(p.error){$("err").textContent=p.error;$("set").innerHTML="";return}
  $("err").textContent="";$("set").innerHTML='<p class="note">Loading the latest quotes from GitHub…</p>';
  initBank().then(function(){showSet(p)})};
$("code").onkeydown=function(e){if(e.key==="Enter")$("load").onclick()};
$("demo").onclick=function(){
  if(BANK.length<4){$("err").textContent="Quotes haven’t loaded yet.";return}
  var by={};BANK.forEach(function(q){(by[q.theme]=by[q.theme]||[]).push(q.id)});
  var th=Object.keys(by).filter(function(t){return by[t].length>=4});
  var pool=th.length?by[th[Math.floor(Math.random()*th.length)]]:BANK.map(function(q){return q.id});
  pool=pool.slice().sort(function(){return Math.random()-.5});
  var c=makeCode(pool.slice(0,4));$("code").value=c;showSet(parseCode(c));
};
$("refresh").onclick=function(){initBank()};

// Calendar
var view=new Date();view.setDate(1);var sel=ymd(new Date());
$("prev").onclick=function(){view.setMonth(view.getMonth()-1);drawCal()};
$("next").onclick=function(){view.setMonth(view.getMonth()+1);drawCal()};
function drawCal(){
  var log=load(),days={};log.forEach(function(e){days[e.date]=(days[e.date]||0)+1});
  $("mname").textContent=view.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  var h="Mon Tue Wed Thu Fri Sat Sun".split(" ").map(function(d){return'<div class="h">'+d+'</div>'}).join("");
  var first=(view.getDay()+6)%7,n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),today=ymd(new Date());
  for(var i=0;i<first;i++)h+='<button class="pad" tabindex="-1" aria-hidden="true"></button>';
  for(var d=1;d<=n;d++){var k=view.getFullYear()+"-"+pad(view.getMonth()+1,2)+"-"+pad(d,2);
    h+='<button data-d="'+k+'" aria-pressed="'+(k===sel)+'" class="'+(days[k]?"has ":"")+(k===today?"today":"")+'" aria-label="'+k+(days[k]?", "+days[k]+" sessions":"")+'">'+d+'</button>'}
  $("grid").innerHTML=h;
  $("grid").querySelectorAll("button[data-d]").forEach(function(b){b.onclick=function(){sel=b.dataset.d;drawCal()}});
  var es=log.filter(function(e){return e.date===sel});
  $("dtitle").textContent=new Date(sel+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  $("dlist").innerHTML=es.length?es.map(function(e){var q=byId[e.pick];
    return'<div class="log"><strong>Task '+e.task+'</strong> · '+e.mins+' min · rated '+e.rate+'/5'+(q?'<div class="q"><blockquote>“'+esc(q.text)+'”</blockquote><small>'+esc(q.by)+'</small><span class="tag">'+q.theme+'</span></div>':"")
      +(e.notes?'<p>'+esc(e.notes)+'</p>':"")+'<span class="note">Set '+e.code+'</span> <button class="btn alt" data-del="'+e.id+'">Delete</button></div>'}).join("")
    :'<p class="note">Nothing logged for this day. Load a set on the Today tab to start.</p>';
  $("dlist").querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){save(load().filter(function(e){return e.id!==+b.dataset.del}));drawCal()}});
}

// Themes
function drawCov(){
  var c={};BANK.forEach(function(q){c[q.theme]=0});
  load().forEach(function(e){var q=byId[e.pick];if(q)c[q.theme]++});
  var max=Math.max.apply(null,Object.values(c).concat([1]));
  $("cov").innerHTML=Object.keys(c).map(function(t){return'<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>'+t+'</span><span class="note" style="text-align:right">'+(c[t]?c[t]+" sessions":"Not practised yet")+'</span></div><div class="bar"><i style="width:'+(c[t]/max*100)+'%"></i></div></div>'}).join("");
}
$("exp").onclick=function(){
  var u=URL.createObjectURL(new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}));
  var a=document.createElement("a");a.href=u;a.download="quotebank-log.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},500);
  $("dmsg").textContent="If nothing downloaded, this preview may block saving files. The installed app would not.";
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;save(a);$("dmsg").textContent="Imported "+a.length+" sessions.";drawCov()}catch(e){$("dmsg").textContent="That file isn’t a valid backup."}};r.readAsText(f)};
initBank().then(function(){drawCov()});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
