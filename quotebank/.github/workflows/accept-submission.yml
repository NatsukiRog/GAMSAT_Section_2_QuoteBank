# Runs when a maintainer adds the "approved" label to a quote issue.
# Appends the quote to quotes.csv, commits to the default branch and closes the issue.
# Only people with triage access or above can add labels, so this is the human gate.
name: Accept quote submission

on:
  issues:
    types: [labeled]

# One run at a time, so two approvals never race to edit quotes.csv.
concurrency:
  group: quote-bank-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  accept:
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'quote-submission')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - id: add
        run: python3 scripts/import_issue.py add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}

      - name: Commit and close
        if: steps.add.outputs.status == 'added'
        env:
          QUOTE_ID: ${{ steps.add.outputs.quote_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.csv
          git commit -m "Add quote $QUOTE_ID from #$NUMBER"
          git push
          gh issue close "$NUMBER" --reason completed --comment "$(cat comment.md)"

      - name: Could not add
        if: steps.add.outputs.status == 'invalid'
        run: |
          gh issue comment "$NUMBER" --body-file comment.md
          gh issue edit "$NUMBER" --add-label needs-fix
          gh issue edit "$NUMBER" --remove-label approved || true
