name: Validate quote bank

on:
  push:
    paths: [quotes.csv, themes.txt, tags.txt, quotebank.py]
  pull_request:
    paths: [quotes.csv, themes.txt, tags.txt, quotebank.py]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 quotebank.py validate
