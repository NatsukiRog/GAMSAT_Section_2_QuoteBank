name: "Submit a quote"
description: "Suggest a quote for the GAMSAT Section 2 quote bank."
title: "Quote: "
labels: ["quote-submission"]
body:
  - type: markdown
    attributes:
      value: "Thanks for contributing! Please include a real source: misattributed quotes will be rejected."
  - type: textarea
    id: quote
    attributes:
      label: "Quote"
      description: "Without surrounding quotation marks."
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: "Author"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source / URL"
      description: "Book, speech, page number or link. Unsourced quotes are often misattributed."
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: "Primary theme"
      options:
        - "Power, politics and authority"
        - "Society, inequality and class"
        - "Justice, morality and ethics"
        - "Technology, science and progress"
        - "Environment and humanity"
        - "Culture, identity and community"
        - "Education, knowledge and truth"
        - "Happiness, fulfilment and purpose"
        - "Success, ambition and failure"
        - "Relationships, love and belonging"
        - "Human nature and psychology"
        - "Suffering, adversity and resilience"
        - "Change, uncertainty and time"
        - "Individuality, freedom and identity"
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: "Section suitability"
      options:
        - "Task A"
        - "Task B"
        - "Both"
    validations:
      required: true
  - type: dropdown
    id: tag_1
    attributes:
      label: "Secondary tag 1"
      description: "Optional."
      options:
        - "Individual vs society"
        - "Optimism vs pessimism"
        - "Nature vs nurture"
        - "Past vs future"
        - "Means vs ends"
        - "Freedom vs security"
        - "Self vs others"
        - "Appearance vs reality"
    validations:
      required: false
  - type: dropdown
    id: tag_2
    attributes:
      label: "Secondary tag 2"
      description: "Optional."
      options:
        - "Individual vs society"
        - "Optimism vs pessimism"
        - "Nature vs nurture"
        - "Past vs future"
        - "Means vs ends"
        - "Freedom vs security"
        - "Self vs others"
        - "Appearance vs reality"
    validations:
      required: false
  - type: dropdown
    id: tag_3
    attributes:
      label: "Secondary tag 3"
      description: "Optional."
      options:
        - "Individual vs society"
        - "Optimism vs pessimism"
        - "Nature vs nurture"
        - "Past vs future"
        - "Means vs ends"
        - "Freedom vs security"
        - "Self vs others"
        - "Appearance vs reality"
    validations:
      required: false
  - type: textarea
    id: interpretation
    attributes:
      label: "Interpretation"
      description: "Optional."
    validations:
      required: false
  - type: textarea
    id: opposing
    attributes:
      label: "Opposing perspective"
      description: "Optional."
    validations:
      required: false
  - type: textarea
    id: example
    attributes:
      label: "Example / evidence"
      description: "Optional."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: "Notes"
      description: "Optional."
    validations:
      required: false
  - type: checkboxes
    id: agreement
    attributes:
      label: "Licence and source"
      options:
        - label: "I agree my contribution is released under CC BY-SA 4.0, and I have checked the source."
          required: true
